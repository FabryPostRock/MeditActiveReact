approval_policy = "on-request"
default_permissions = "project-only"

[permissions.project-only]
description = "Accesso limitato al repository Node corrente."

[permissions.project-only.filesystem]
":minimal" = "read"
"/home/codex_user/.vscode-server/extensions/**" = "read"
glob_scan_max_depth = 4

[permissions.project-only.filesystem.":workspace_roots"]
"." = "write"

".env" = "deny"
".env.*" = "deny"
"**/.env" = "deny"
"**/.env.*" = "deny"

[permissions.project-only.network]
enabled = false

[history]
persistence = "none"