<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 900"
  preserveAspectRatio="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Pareti laterali infinite con sfumature più definite</title>
  <desc id="description">
    Due pareti laterali profonde 320 unità con colori più nitidi e una dissolvenza morbida verso il centro trasparente.
  </desc>

  <defs>
    <linearGradient id="leftWall" x1="0" y1="450" x2="320" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4e8af" stop-opacity="0.84" />
      <stop offset="0.2" stop-color="#7fc87b" stop-opacity="0.82" />
      <stop offset="0.43" stop-color="#69ba66" stop-opacity="0.76" />
      <stop offset="0.59" stop-color="#aec765" stop-opacity="0.68" />
      <stop offset="0.72" stop-color="#eba416" stop-opacity="0.58" />
      <stop offset="0.82" stop-color="#f0b83e" stop-opacity="0.42" />
      <stop offset="0.9" stop-color="#f5d58d" stop-opacity="0.25" />
      <stop offset="0.96" stop-color="#faedcf" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rightWall" x1="1440" y1="450" x2="1120" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4e8af" stop-opacity="0.84" />
      <stop offset="0.2" stop-color="#7fc87b" stop-opacity="0.82" />
      <stop offset="0.43" stop-color="#69ba66" stop-opacity="0.76" />
      <stop offset="0.59" stop-color="#aec765" stop-opacity="0.68" />
      <stop offset="0.72" stop-color="#eba416" stop-opacity="0.58" />
      <stop offset="0.82" stop-color="#f0b83e" stop-opacity="0.42" />
      <stop offset="0.9" stop-color="#f5d58d" stop-opacity="0.25" />
      <stop offset="0.96" stop-color="#faedcf" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="motionBand" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.2" stop-color="#fff4dc" stop-opacity="0.08" />
      <stop offset="0.4" stop-color="#eba416" stop-opacity="0.18" />
      <stop offset="0.6" stop-color="#63b760" stop-opacity="0.14" />
      <stop offset="0.82" stop-color="#fff4dc" stop-opacity="0.07" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="leftMotionFade" x1="0" y1="450" x2="320" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.93" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rightMotionFade" x1="1440" y1="450" x2="1120" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.93" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <pattern id="verticalFlow" width="1440" height="300" patternUnits="userSpaceOnUse">
      <rect width="1440" height="300" fill="url(#motionBand)" />
    </pattern>

    <mask id="leftMotionMask" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="900">
      <rect width="320" height="900" fill="url(#leftMotionFade)" />
    </mask>

    <mask id="rightMotionMask" maskUnits="userSpaceOnUse" x="1120" y="0" width="320" height="900">
      <rect x="1120" width="320" height="900" fill="url(#rightMotionFade)" />
    </mask>
  </defs>

  <rect width="320" height="900" fill="url(#leftWall)" />
  <rect x="1120" width="320" height="900" fill="url(#rightWall)" />
  <rect width="320" height="900" fill="url(#verticalFlow)" mask="url(#leftMotionMask)" />
  <rect x="1120" width="320" height="900" fill="url(#verticalFlow)" mask="url(#rightMotionMask)" />
</svg>
