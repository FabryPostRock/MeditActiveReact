<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1440 900"
  preserveAspectRatio="none"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Pareti laterali infinite con motivo a loto</title>
  <desc id="description">
    Due pareti laterali nitide decorate con fiori di loto lineari e dissolte verso il centro trasparente.
  </desc>

  <defs>
    <linearGradient id="leftWall" x1="0" y1="450" x2="320" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4e8af" stop-opacity="0.84" />
      <stop offset="0.2" stop-color="#7fc87b" stop-opacity="0.82" />
      <stop offset="0.43" stop-color="#69ba66" stop-opacity="0.76" />
      <stop offset="0.59" stop-color="#aec765" stop-opacity="0.68" />
      <stop offset="0.72" stop-color="#eba416" stop-opacity="0.58" />
      <stop offset="0.82" stop-color="#f0b83e" stop-opacity="0.42" />
      <stop offset="0.9" stop-color="#f5d58d" stop-opacity="0.25" />
      <stop offset="0.96" stop-color="#faedcf" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rightWall" x1="1440" y1="450" x2="1120" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4e8af" stop-opacity="0.84" />
      <stop offset="0.2" stop-color="#7fc87b" stop-opacity="0.82" />
      <stop offset="0.43" stop-color="#69ba66" stop-opacity="0.76" />
      <stop offset="0.59" stop-color="#aec765" stop-opacity="0.68" />
      <stop offset="0.72" stop-color="#eba416" stop-opacity="0.58" />
      <stop offset="0.82" stop-color="#f0b83e" stop-opacity="0.42" />
      <stop offset="0.9" stop-color="#f5d58d" stop-opacity="0.25" />
      <stop offset="0.96" stop-color="#faedcf" stop-opacity="0.1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="motionBand" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.2" stop-color="#fff4dc" stop-opacity="0.08" />
      <stop offset="0.4" stop-color="#eba416" stop-opacity="0.18" />
      <stop offset="0.6" stop-color="#63b760" stop-opacity="0.14" />
      <stop offset="0.82" stop-color="#fff4dc" stop-opacity="0.07" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="leftFade" x1="0" y1="450" x2="320" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.93" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="rightFade" x1="1440" y1="450" x2="1120" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.93" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <pattern id="verticalFlow" width="1440" height="300" patternUnits="userSpaceOnUse">
      <rect width="1440" height="300" fill="url(#motionBand)" />
    </pattern>

    <pattern id="leftLotus" width="320" height="300" patternUnits="userSpaceOnUse">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4">
        <path d="M160 206C133 174 135 130 160 92C185 130 187 174 160 206Z" stroke="#fff8e7" stroke-opacity="0.42" />
        <path d="M157 205C120 201 93 174 88 133C123 140 151 165 157 205Z" stroke="#2f7d4c" stroke-opacity="0.3" />
        <path d="M163 205C200 201 227 174 232 133C197 140 169 165 163 205Z" stroke="#2f7d4c" stroke-opacity="0.3" />
        <path d="M132 198C104 194 81 176 68 150C96 151 122 168 132 198Z" stroke="#f6d58d" stroke-opacity="0.34" />
        <path d="M188 198C216 194 239 176 252 150C224 151 198 168 188 198Z" stroke="#f6d58d" stroke-opacity="0.34" />
        <path d="M86 215C127 229 193 229 234 215" stroke="#fff8e7" stroke-opacity="0.36" />
      </g>
    </pattern>

    <pattern id="rightLotus" x="1120" width="320" height="300" patternUnits="userSpaceOnUse">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4">
        <path d="M1280 206C1253 174 1255 130 1280 92C1305 130 1307 174 1280 206Z" stroke="#fff8e7" stroke-opacity="0.42" />
        <path d="M1277 205C1240 201 1213 174 1208 133C1243 140 1271 165 1277 205Z" stroke="#2f7d4c" stroke-opacity="0.3" />
        <path d="M1283 205C1320 201 1347 174 1352 133C1317 140 1289 165 1283 205Z" stroke="#2f7d4c" stroke-opacity="0.3" />
        <path d="M1252 198C1224 194 1201 176 1188 150C1216 151 1242 168 1252 198Z" stroke="#f6d58d" stroke-opacity="0.34" />
        <path d="M1308 198C1336 194 1359 176 1372 150C1344 151 1318 168 1308 198Z" stroke="#f6d58d" stroke-opacity="0.34" />
        <path d="M1206 215C1247 229 1313 229 1354 215" stroke="#fff8e7" stroke-opacity="0.36" />
      </g>
    </pattern>

    <mask id="leftMask" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="900">
      <rect width="320" height="900" fill="url(#leftFade)" />
    </mask>

    <mask id="rightMask" maskUnits="userSpaceOnUse" x="1120" y="0" width="320" height="900">
      <rect x="1120" width="320" height="900" fill="url(#rightFade)" />
    </mask>
  </defs>

  <rect width="320" height="900" fill="url(#leftWall)" />
  <rect x="1120" width="320" height="900" fill="url(#rightWall)" />
  <rect width="320" height="900" fill="url(#verticalFlow)" mask="url(#leftMask)" />
  <rect x="1120" width="320" height="900" fill="url(#verticalFlow)" mask="url(#rightMask)" />
  <rect width="320" height="900" fill="url(#leftLotus)" mask="url(#leftMask)" />
  <rect x="1120" width="320" height="900" fill="url(#rightLotus)" mask="url(#rightMask)" />
</svg>
